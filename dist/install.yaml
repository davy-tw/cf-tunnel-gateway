  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cf-tunnel-gateway-leader-election
subjects:
- kind: ServiceAccount
  name: cf-tunnel-gateway
  namespace: cf-tunnel-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cf-tunnel-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cf-tunnel-gateway
subjects:
- kind: ServiceAccount
  name: cf-tunnel-gateway
  namespace: cf-tunnel-gateway-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: cf-tunnel-gateway
  name: cf-tunnel-gateway-metrics
  namespace: cf-tunnel-gateway-system
spec:
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: cf-tunnel-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cf-tunnel-gateway
  name: cf-tunnel-gateway
  namespace: cf-tunnel-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cf-tunnel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cf-tunnel-gateway
    spec:
      containers:
      - env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - secretRef:
            name: cf-tunnel-gateway
            optional: true
        image: ghcr.io/davy-tw/cf-tunnel-gateway/controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
        name: manager
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cf-tunnel-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cf-tunnel-gateway
spec:
  controllerName: cf-tunnel-gateway.davy.tw/gateway-controller
  description: Exposes Gateways through Cloudflare Tunnel.
  parametersRef:
    group: ""
    kind: Secret
    name: cf-tunnel-gateway
    namespace: cf-tunnel-gateway-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  annotations:
    cf-tunnel-gateway.davy.tw/instance: cf-tunnel-gateway
  name: cf-tunnel-gateway
spec:
  controller: cf-tunnel-gateway.davy.tw/ingress-controller
