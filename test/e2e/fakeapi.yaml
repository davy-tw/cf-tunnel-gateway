# The fake Cloudflare API the end-to-end tests point the controller at
# (see `make e2e-install`, which sets the image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-cloudflare-api
  labels:
    app.kubernetes.io/name: fake-cloudflare-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-cloudflare-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-cloudflare-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: fakeapi
          imagePullPolicy: Never
          env:
            - name: FAKE_TOKEN
              value: e2e-token
            - name: FAKE_ACCOUNT
              value: e2e-account
            - name: FAKE_ZONES
              value: example.com
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-cloudflare-api
spec:
  selector:
    app.kubernetes.io/name: fake-cloudflare-api
  ports:
    - name: http
      port: 8080
      targetPort: http
