# Smoke test: one Gateway with its own tunnel and one HTTPRoute splitting
# /api and / across two backends. Replace example.com with a zone the
# GatewayClass's token can edit; https://demo.example.com then answers once
# the Gateway is Programmed.
apiVersion: v1
kind: Namespace
metadata:
  name: cf-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cf-demo
spec:
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080", "--name=api"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cf-demo
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cf-demo
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080", "--name=web"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cf-demo
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: cf-demo
spec:
  gatewayClassName: cf-tunnel-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: cf-demo
spec:
  parentRefs:
    - name: demo
  hostnames: ["demo.example.com"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: api
          port: 8080
    - backendRefs:
        - name: web
          port: 80
