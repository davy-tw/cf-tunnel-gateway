# A Gateway owned by a platform team (namespace platform-gw) that lets the
# team-apps namespace add its own hostnames with a ListenerSet. The team's
# listeners run on the Gateway's tunnel and connector. A hostname belongs to
# one owner (the Gateway or one ListenerSet), so the team cannot take or
# extend the platform's hostnames, and the platform's routes cannot take the
# team's. Replace example.com with a zone the GatewayClass's token can edit.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gw
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-apps
  labels:
    gateway-access: shared
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: platform-gw
spec:
  gatewayClassName: cf-tunnel-gateway
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          gateway-access: shared
  listeners:
    - name: www
      protocol: HTTP
      port: 80
      hostname: www.example.com
---
# The team's listener. Its namespace may also limit what it publishes with
# the cf-tunnel-gateway.davy.tw/allowed-hostnames annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: team-apps
  namespace: team-apps
spec:
  parentRef:
    name: shared
    namespace: platform-gw
  listeners:
    - name: app
      protocol: HTTPS
      port: 443
      hostname: team.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: team-apps
spec:
  parentRefs:
    - kind: ListenerSet
      name: team-apps
      sectionName: app
  rules:
    - backendRefs:
        - name: app
          port: 80
