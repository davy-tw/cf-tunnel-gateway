{{/* Kept in sync with config/rbac/cluster_role.yaml (checked by a test). */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-tunnel-gateway.fullname" . }}
  labels:
    {{- include "cf-tunnel-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - referencegrants
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
      - grpcroutes/status
      - tcproutes/status
    verbs: [get, update, patch]
  # Owner references with blockOwnerDeletion need update on the owner's
  # finalizers (OwnerReferencesPermissionEnforcement).
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways/finalizers]
    verbs: [update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [services/finalizers]
    verbs: [update]
  # The bundle version of the installed Gateway API.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [get, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [services/status]
    verbs: [get, update, patch]
  # Secrets: class credentials (read) and connector token Secrets (written).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
