{{- if and (not .Values.cloudflare.existingSecret) (or .Values.cloudflare.accountId .Values.cloudflare.apiToken) }}
{{- if not (and .Values.cloudflare.accountId .Values.cloudflare.apiToken) }}
{{- fail "cloudflare.accountId and cloudflare.apiToken must be set together" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cf-tunnel-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUDFLARE_ACCOUNT_ID: {{ .Values.cloudflare.accountId | quote }}
  CLOUDFLARE_API_TOKEN: {{ .Values.cloudflare.apiToken | quote }}
  {{- with .Values.cloudflare.dnsApiToken }}
  dnsApiToken: {{ . | quote }}
  {{- end }}
{{- end }}
